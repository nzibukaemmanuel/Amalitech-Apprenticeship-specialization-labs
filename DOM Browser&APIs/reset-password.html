<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Notes</title>
<meta name="description" content="Choose a new password for your Notes account." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
<a class="skip-link" href="#password">Skip to form</a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand" id="brand"></div>

    <div id="reset-form-view">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Choose a new password for your account.</p>

      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

      <form class="auth-form" id="auth-form" novalidate>
        <div class="field">
          <label for="password">New Password</label>
          <div class="password-input">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password-hint password-error" />
            <button type="button" class="password-toggle" id="password-toggle" aria-pressed="false" aria-label="Show password">
              <svg aria-hidden="true"><use href="#icon-eye" /></svg>
            </button>
          </div>
          <p class="field-hint" id="password-hint"><svg class="hint-icon" aria-hidden="true"><use href="#icon-info-circle" /></svg> At least 8 characters</p>
          <p class="field-error" id="password-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="confirm-password">Confirm New Password</label>
          <div class="password-input">
            <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" aria-describedby="confirm-password-error" />
            <button type="button" class="password-toggle" id="confirm-password-toggle" aria-pressed="false" aria-label="Show password">
              <svg aria-hidden="true"><use href="#icon-eye" /></svg>
            </button>
          </div>
          <p class="field-error" id="confirm-password-error" role="alert"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
      </form>
    </div>

    <div class="invalid-link-notice" id="invalid-link-notice" hidden>
      <p class="empty-title">This reset link is invalid or has expired</p>
      <p>Reset links only work once and expire after 15 minutes. Request a new one to continue.</p>
      <a href="forgot-password.html" class="btn btn-primary btn-block">Request a new link</a>
    </div>

    <p class="auth-footer">Remembered your password? <a href="login.html">Back to login</a></p>
  </div>
</main>

<script type="module" src="reset-password.js"></script>
</body>
</html>
