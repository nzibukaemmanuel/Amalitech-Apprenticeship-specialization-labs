<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Notes</title>
<meta name="description" content="Create a Notes account to start organizing your notes." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
<a class="skip-link" href="#email">Skip to form</a>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand" id="brand"></div>

    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">Sign up to start organizing your notes and boost your productivity.</p>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>

    <form class="auth-form" id="auth-form" novalidate>
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="email@example.com" required autocomplete="email" aria-describedby="email-error" />
        <p class="field-error" id="email-error" role="alert"></p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-input">
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" aria-describedby="password-hint password-error" />
          <button type="button" class="password-toggle" id="password-toggle" aria-pressed="false" aria-label="Show password">
            <svg aria-hidden="true"><use href="#icon-eye" /></svg>
          </button>
        </div>
        <p class="field-hint" id="password-hint"><svg class="hint-icon" aria-hidden="true"><use href="#icon-info-circle" /></svg> At least 8 characters</p>
        <p class="field-error" id="password-error" role="alert"></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Sign up</button>
    </form>

    <div class="auth-divider">Or log in with:</div>

    <button type="button" class="btn btn-outline btn-block google-btn" id="google-btn">
      <span class="google-icon" aria-hidden="true">G</span> Google
    </button>

    <p class="auth-footer">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<script type="module" src="signup.js"></script>
</body>
</html>
